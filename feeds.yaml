# 모닝 브리핑이 매일 아침 읽어오는 RSS 피드.
# 본인 관심사로 자유롭게 교체/추가하세요.
#
# 한국어 매체 RSS는 종종 URL 바뀌니 동작 안 하면 사이트에서 RSS 링크 재확인.
# 깨진 피드는 lib/rss.py가 알아서 스킵하므로 큰 문제 없음.

feeds:
  # 한국 종합 경제
  - name: 매일경제 헤드라인
    url: https://www.mk.co.kr/rss/30000001/

  - name: 한국경제 마켓
    url: https://rss.hankyung.com/feed/finance.xml

  - name: 연합뉴스 경제
    url: https://www.yna.co.kr/rss/economy.xml

  # 영문 (글로벌 시장 컨텍스트)
